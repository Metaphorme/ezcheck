[package]
name = "ezcheck"
version = "0.1.7"
edition = "2021"
description = "An easy-to-use, lightweight, cross-platform, and high-performance tool for calculating, comparing, and verifying hash of strings and files."
repository = "https://github.com/Metaphorme/ezcheck"
documentation = "https://docs.rs/ezcheck"
readme = "README.md"
authors = ["Heqi Liu 77@diazepam.cc"]
license = "MIT"
rust-version = "1.85.1"

[dependencies]
md2 = { version = "0.11", optional = true }
md4 = { version = "0.11", optional = true }
md-5 = { version = "0.11", optional = true }
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }
digest = { version = "0.11", optional = true }
ring = { version = "0.17", optional = true }
clap = { version = "4.6", features = ["derive"] }
twox-hash = { version = "2.1.2", features = ["std"] }

[features]
default = ["mix_backend"]
hashes_backend = ["dep:md2", "dep:md4", "dep:md-5", "dep:sha1", "dep:sha2", "dep:digest"]
ring_backend = ["dep:ring"]
mix_backend = ["hashes_backend", "ring_backend"]
